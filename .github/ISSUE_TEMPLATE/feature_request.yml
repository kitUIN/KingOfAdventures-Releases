name: 提交建议
description: 提出游戏功能或体验改进建议
title: "[建议] "
body:
  - type: textarea
    id: context
    attributes:
      label: 使用场景
      description: 你在什么情况下希望游戏有所改进？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议内容
      description: 你希望如何改进，会带来什么变化？
    validations:
      required: true
